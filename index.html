<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Copy Tool</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    text-align:center;
    padding:30px;
}
textarea{
    width:80%;
    height:120px;
    padding:10px;
    font-size:16px;
}
button{
    padding:10px 18px;
    margin:15px;
    font-size:16px;
    cursor:pointer;
}
#output{
    width:85%;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}
.word{
    background:white;
    border:1px solid #ccc;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
}
.word:hover{
    background:#e6f2ff;
    border-color:#3399ff;
}
.copied{
    background:#b3ffcc !important;
}
</style>
</head>

<body>

<h2>Paragraph → Click Word → Copy</h2>

<textarea id="para" placeholder="Paste your paragraph here..."></textarea><br>
<button onclick="splitWords()">Generate Words</button>

<div id="output"></div>

<script>
function splitWords(){
    const text = document.getElementById("para").value;

    // remove punctuation: . , ! ? : ; ' " ( ) etc
    const clean = text.replace(/[.,!?;:"'()\-]/g,"");

    // split words by any space/newline
    const words = clean.split(/\s+/).filter(w=>w.length>0);

    const out = document.getElementById("output");
    out.innerHTML="";

    words.forEach(word=>{
        const div=document.createElement("div");
        div.className="word";
        div.textContent=word;

        div.onclick=()=>{
            navigator.clipboard.writeText(word);
            div.classList.add("copied");
            setTimeout(()=>div.classList.remove("copied"),600);
        };

        out.appendChild(div);
    });
}
</script>

</body>
</html>
