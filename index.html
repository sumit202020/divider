<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Copy Tool</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    text-align:center;
    padding:30px;
}
textarea{
    width:80%;
    height:120px;
    padding:10px;
    font-size:16px;
}
button{
    padding:10px 18px;
    margin:15px;
    font-size:16px;
    cursor:pointer;
}
#output{
    width:85%;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}
.word{
    background:white;
    border:1px solid #ccc;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
}
.word:hover{
    background:#e6f2ff;
    border-color:#3399ff;
}

/* Normal words */
.word.active{
    background:#4CAF50;
    color:white;
    border-color:#4CAF50;
    font-weight:bold;
}

/* Special tags */
.word.special-active{
    background:#ff9800;
    color:white;
    border-color:#ff9800;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Paragraph → Click Word → Copy</h2>

<textarea id="para" placeholder="Paste your paragraph here..."></textarea><br>
<button onclick="splitWords()">Generate Words</button>

<div id="output"></div>

<script>

let lastSelected=null;          // for normal words
let lastSpecial=null;           // for special tags
let specialTimer=null;          // timer reference

function splitWords(){

    const text=document.getElementById("para").value;
    const clean=text.replace(/[.,!?;:।"'()\-]/g,"");
    const words=clean.split(/\s+/).filter(w=>w.length>0);

    const out=document.getElementById("output");
    out.innerHTML="";
    lastSelected=null;
    lastSpecial=null;

    // ✅ Normal Words FIRST
    words.forEach(word=>{

        const div=document.createElement("div");
        div.className="word";
        div.textContent=word;

        div.onclick=()=>{

            navigator.clipboard.writeText(word);

            if(lastSelected){
                lastSelected.classList.remove("active");
            }

            div.classList.add("active");
            lastSelected=div;
        };

        out.appendChild(div);
    });

    // ✅ Special Tags AFTER paragraph
    const specialTags=[
        "<NOISE></NOISE>",
        "<SIL></SIL>",
        "<MB></MB>",
        "<ADULT></ADULT>",
        "<FIL></FIL>"
    ];

    specialTags.forEach(tag=>{

        const div=document.createElement("div");
        div.className="word";
        div.textContent=tag;

        div.onclick=()=>{

            navigator.clipboard.writeText(tag);

            // remove old special highlight immediately
            if(lastSpecial){
                lastSpecial.classList.remove("special-active");
            }

            // clear old timer
            if(specialTimer){
                clearTimeout(specialTimer);
            }

            div.classList.add("special-active");
            lastSpecial=div;

            // remove after 5 seconds
            specialTimer=setTimeout(()=>{
                div.classList.remove("special-active");
                lastSpecial=null;
            },5000);
        };

        out.appendChild(div);
    });
}
</script>

</body>
</html>
